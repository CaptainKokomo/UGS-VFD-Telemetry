name: Build UGS VFD Telemetry

on:
  push:
    branches:
      - vfd-telemetry
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.1.4

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-maven

      - name: Compile application
        shell: bash
        run: ./mvnw clean install -B -DskipTests=true -Drevision=${APP_VERSION} -Dchangelist=

      - name: Test VFD integration
        shell: bash
        run: ./mvnw test -B -pl ugs-fx -Drevision=${APP_VERSION} -Dchangelist=

      - name: Package Windows installer
        shell: bash
        run: ./mvnw package -B -pl ugs-fx -P fx-build-windows -DskipTests=true -Drevision=${APP_VERSION} -Dchangelist=

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: UGS-VFD-Telemetry-Windows
          path: |
            ugs-fx/target/installer/UGS-VFD-Telemetry-Setup-*.exe
            ugs-fx/target/installer/UGS-VFD-Telemetry-*.msi
            ugs-fx/target/installer/UGS-VFD-Telemetry-Portable-*.zip
          if-no-files-found: error

      - name: Publish repaired Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" \
            "ugs-fx/target/installer/UGS-VFD-Telemetry-Setup-${APP_VERSION}-x64.exe" \
            "ugs-fx/target/installer/UGS-VFD-Telemetry-${APP_VERSION}-x64.msi" \
            "ugs-fx/target/installer/UGS-VFD-Telemetry-Portable-${APP_VERSION}-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UGS VFD Telemetry ${APP_VERSION}" \
            --notes "HS350 compatibility repair: telemetry now uses individual documented register reads instead of one large block request that some VFD variants silently discard. Portable build; no installation required." \
            --prerelease
